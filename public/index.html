<style>

<script>
'use strict';
/* ---------- constants ---------- */
const SHORT={'Wirtschaftsinformatik':'WiInf','Global Business Management':'GBM','Medien und Kommunikation':'MuK','Wirtschaftsingenieurwesen':'WiIng','Rechtswissenschaft':'Jura','Materialwissenschaft':'MaWi','Sozialwissenschaften':'SoWi','Betriebswirtschaftslehre':'BWL','Volkswirtschaftslehre':'VWL'};
const KNOWN_SG=['BWL','VWL','Wirtschaftsinformatik','Informatik','Global Business Management','Medien und Kommunikation','Wirtschaftsingenieurwesen','Rechtswissenschaft','Data Science','Physik','Materialwissenschaft','Sozialwissenschaften','Mathematik','Geographie','Psychologie','Lehramt','Wirtschaftsmathematik','Ingenieurinformatik','Medizin','Sportwissenschaft','Politikwissenschaft','Soziologie'];
// Schreibweisen, die als derselbe Studiengang gelten (Kleinschreibung). Eigene Regeln kommen aus /einstellungen dazu.
const SG_ALIAS={'betriebswirtschaftslehre':'BWL','betriebswirtschaft':'BWL','business administration':'BWL','bwl':'BWL',
  'volkswirtschaftslehre':'VWL','volkswirtschaft':'VWL','economics':'VWL','vwl':'VWL',
  'gbm':'Global Business Management','global business management':'Global Business Management',
  'wirtschaftsinf.':'Wirtschaftsinformatik','information systems':'Wirtschaftsinformatik',
  'jura':'Rechtswissenschaft','rechtswissenschaften':'Rechtswissenschaft','jus':'Rechtswissenschaft',
  'wiing':'Wirtschaftsingenieurwesen','wirtschaftsingenieurswesen':'Wirtschaftsingenieurwesen',
  'muk':'Medien und Kommunikation','medien & kommunikation':'Medien und Kommunikation'};
function sgNames(){return[...new Set([...KNOWN_SG,...Object.values(S.sgAlias||{}),...S.apps.map(a=>a.sg).filter(Boolean)])].slice(0,80)}
function canonSg(raw,user){
  let s=String(raw||'').replace(/\s+/g,' ').trim();if(!s)return'';
  s=s.replace(/\s*\((?:b|m)\.?\s?(?:sc|a|ed|eng)\.?\)\s*$/i,'').replace(/\s*[,(-]?\s*(?:(?:b|m)\.\s?(?:sc|a|ed|eng)\.?|bachelor|master)\s*\)?\s*$/i,'').replace(/^(?:(?:b|m)\.\s?(?:sc|a)\.?|bachelor|master)\s+(?:of\s+\w+\s+)?(?:in\s+)?/i,'').trim();
  const k=s.toLowerCase(),u=user||(S&&S.sgAlias)||{};
  if(u[k])return u[k];if(SG_ALIAS[k])return SG_ALIAS[k];
  const known=KNOWN_SG.find(x=>x.toLowerCase()===k);if(known)return known;
  const ex=S&&S.apps?S.apps.map(a=>a.sg).find(x=>x&&x.toLowerCase()===k):null;
  return ex||s;
}
const FEM=['Anna','Lea','Sophie','Marie','Laura','Julia','Hannah','Lena','Mia','Clara','Paula','Emma','Katharina','Selin','Aylin','Elif','Jana','Johanna','Nina','Sarah','Lisa','Amira','Valentina','Theresa','Sophia','Leonie','Lara','Franziska','Christina','Maria','Elena','Sara','Vanessa','Jasmin','Melanie','Carina','Verena','Magdalena','Alina','Antonia','Helena','Isabel','Charlotte','Luisa','Emily','Zoe','Nele','Svenja','Annika','Miriam'];
const MAL=['Lukas','Jonas','Felix','Maximilian','Paul','Leon','Tim','David','Moritz','Simon','Elias','Niklas','Jakob','Tobias','Emre','Mehmet','Marco','Fabian','Florian','Benedikt','Julian','Raphael','Arjun','Quirin','Andreas','Michael','Thomas','Daniel','Philipp','Johannes','Sebastian','Alexander','Christian','Stefan','Matthias','Dominik','Patrick','Markus','Lorenz','Valentin','Anton','Vincent','Noah','Ben','Finn','Luis','Jan','Max','Samuel','Oliver'];
const AMB=['Kim','Alex','Luca','Robin','Noa','Sascha','Andrea','Mika','Sam','Toni','Jona','Maxi'];
const SN={offen:'offen',zusage:'zusage',warte:'warteliste',absage:'absage'};
const DEFAULT_TPL={
zusage:{s:'Zusage: {kurs}',b:'Hallo {vorname},\n\nvielen Dank für deine Bewerbung. Wir freuen uns, dir einen Platz in der „{kurs}" anbieten zu können.\n\nDie erste Sitzung findet am {termin} statt ({ort}). Eine Bestätigung ist nicht nötig. Wer zur ersten Sitzung nicht kommt, gibt den Platz an die Warteliste ab. Falls du doch nicht teilnehmen kannst, sag uns bitte kurz Bescheid.\n\nViele Grüße\n{absender}'},
warte:{s:'Warteliste: {kurs}',b:'Hallo {vorname},\n\nvielen Dank für deine Bewerbung für die „{kurs}". Wir hatten deutlich mehr Bewerbungen als Plätze. Du stehst auf Platz {position} der Warteliste.\n\nSobald ein Platz frei wird, melden wir uns. Das passiert meist nach der ersten Sitzung am {termin}.\n\nViele Grüße\n{absender}'},
absage:{s:'Deine Bewerbung: {kurs}',b:'Hallo {vorname},\n\nvielen Dank für dein Interesse an der „{kurs}". Leider hatten wir deutlich mehr Bewerbungen als Plätze und können dir diesmal keinen Platz anbieten.\n\nDas Gründungszentrum bietet laufend weitere Formate an. Wir freuen uns, wenn du dich wieder bewirbst.\n\nViele Grüße\n{absender}'},
nach:{s:'Ein Platz ist frei: {kurs}',b:'Hallo {vorname},\n\nin der „{kurs}" ist ein Platz frei geworden, und du bist als Nächste:r auf der Warteliste dran.\n\nDie nächste Sitzung ist am {termin2} ({ort}). Komm einfach vorbei. Falls du keine Zeit mehr hast, sag uns bitte bis morgen Bescheid.\n\nViele Grüße\n{absender}'}};
const COURSES={suc:{name:'Start-up Challenge',info:true,letters:false,docs:true},kanu:{name:'KANU',info:false,letters:true,docs:true}};
let COURSE='suc';try{const c=JSON.parse(localStorage.getItem('kursauswahl-ui')||'{}').course;if(COURSES[c])COURSE=c}catch(e){}
const F=()=>COURSES[COURSE];
function emptyState(c){c=c||COURSE;return{apps:[],sgAlias:{},infoNames:null,demo:false,kurs:COURSES[c].name,semester:'WiSe 2026/27',plaetze:32,termin:'Mittwoch, 21.10.2026, 18:00 Uhr',termin2:'Mittwoch, 28.10.2026, 18:00 Uhr',ort:'Gründungszentrum',absender:'Team Gründungszentrum',senderAddr:'',tpl:JSON.parse(JSON.stringify(DEFAULT_TPL))}}

/* ---------- server I/O (Team-Betrieb) ---------- */
let S=null,REV=0,HEALTH={mistral:false},saveTimer=null,saving=false,dirty=false,TOKEN='',EPOCH=null;
let OTHER=[],CS={},FILES={},SHADOW=new Map(),SET_SHADOW='',PHOTOS={},JOBS=[],HELPER=null,SKEW=0,needRender=false,swipeDown=false,lastSig='';
const SETTINGS_KEYS=['kurs','semester','plaetze','termin','termin2','ort','absender','senderAddr','tpl','sgAlias','demo','infoNames'];
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','X-Team-Token':TOKEN,...(opts.headers||{})}});
  let j=null;try{j=await r.json()}catch(_){}
  if(r.status===401){noAccess(j&&j.error);const e=new Error('Kein Zugang');e.status=401;throw e}
  if(!r.ok){const e=new Error((j&&j.error)||('Fehler '+r.status));e.status=r.status;e.body=j;throw e}
  return j;
}
function settingsOf(s){const o={};SETTINGS_KEYS.forEach(k=>o[k]=s[k]);if(EPOCH)o.epoch=EPOCH;return o}
function save(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,250)}
async function flush(){
  if(saving){saveTimer=setTimeout(flush,200);return}
  if(!dirty||!S)return;saving=true;dirty=false;
  const ops=[],ids=new Set();
  for(const a of [...S.apps,...OTHER]){ids.add(a.id);const j=JSON.stringify(a);if(SHADOW.get(a.id)!==j)ops.push({id:a.id,j})}
  for(const id of SHADOW.keys())if(!ids.has(id))ops.push({id,del:true});
  const sj=JSON.stringify(settingsOf(S)),setChanged=sj!==SET_SHADOW,sc=COURSE;
  try{
    for(let i=0;i<ops.length||(i===0&&setChanged);i+=25){
      const chunk=ops.slice(i,i+25);
      await api('/api/ops',{method:'POST',body:JSON.stringify({apps:chunk.map(o=>o.del?{id:o.id,deleted:true}:{id:o.id,data:JSON.parse(o.j)}),...(i===0&&setChanged?{courseSettings:{course:sc,data:JSON.parse(sj)}}:{})})});
      chunk.forEach(o=>{if(o.del)SHADOW.delete(o.id);else SHADOW.set(o.id,o.j)});
    }
    if(setChanged){CS[sc]=JSON.parse(sj);if(sc===COURSE)SET_SHADOW=sj}
    $('#offline').hidden=true;
  }catch(e){if(e.status!==401){$('#offline').hidden=false;dirty=true;saveTimer=setTimeout(flush,3000)}}
  finally{saving=false}

async function filesFromDrop(dt){

const nameKey=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/ı/g,'i').replace(/\([^)]*\)/g,' ').replace(/[^a-z@. ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
// Vergleicht eine Bewerbung mit einem Listeneintrag: 2 = sicher, 1 = unsicher, 0 = kein Treffer
function matchScore(a,p){
  if(p.email&&a.email&&p.email===a.email.toLowerCase())return 2;
  const full=nameKey(a.vn+' '+a.nn),q=nameKey(p.name).split(' ').filter(x=>!x.includes('@')).join(' ');if(!full||!q)return 0;
  const tA=full.split(' ').sort().join(' '),tQ=q.split(' ').sort().join(' ');
  if(full===q||tA===tQ)return 2;
  const vn=nameKey(a.vn).split(' ')[0],nn=nameKey(a.nn).split(' ').pop(),qt=q.split(' ');
  if(nn&&vn&&qt.includes(nn)&&qt.includes(vn))return 2;
  if(full.length>6&&(lev(full,q)<=2||lev(tA,tQ)<=2))return 1;
  if(nn&&vn&&qt.includes(nn)&&qt.some(t=>t[0]===vn[0]))return 1;
  return 0;
}
function bestMatch(a,list){let best=0,who=null;for(const p of list){const s=matchScore(a,p);if(s>best){best=s;who=p;if(s===2)break}}return{score:best,who}}

// Word-Datei (.docx) im Browser entpacken: Text samt Tabellen und eingebettete Bilder (Screenshots)
async function unzip(file){
  const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);let eocd=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-65558);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error(file.name+' ist keine gültige Word-Datei');
  const n=dv.getUint16(eocd+10,true);let p=dv.getUint32(eocd+16,true);const entries=[];
  for(let k=0;k<n&&dv.getUint32(p,true)===0x02014b50;k++){
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    entries.push({name:new TextDecoder().decode(buf.subarray(p+46,p+46+nlen)),method,csize,off});p+=46+nlen+elen+clen}
  const read=async e=>{const start=e.off+30+dv.getUint16(e.off+26,true)+dv.getUint16(e.off+28,true),data=buf.subarray(start,start+e.csize);
    if(e.method===0)return data;if(e.method!==8)throw new Error('Word-Datei nicht lesbar');
    if(typeof DecompressionStream==='undefined')throw new Error('Dieser Browser kann Word-Dateien nicht entpacken. Bitte Chrome, Safari oder Firefox aktualisieren.');
    return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())};
  return{entries,read};
}
async function docxParts(file){
  const z=await unzip(file);const docE=z.entries.find(e=>e.name==='word/document.xml');if(!docE)throw new Error(file.name+': kein Dokumenttext gefunden');
  const xml=new TextDecoder().decode(await z.read(docE));
  // Bilder in der Reihenfolge, in der sie im Dokument vorkommen
  let order=[];try{const rels=z.entries.find(e=>e.name==='word/_rels/document.xml.rels');if(rels){const rx=new TextDecoder().decode(await z.read(rels));const map={};
    rx.replace(/<Relationship\b[^>]*>/g,t=>{const id=(t.match(/Id="([^"]+)"/)||[])[1],tg=(t.match(/Target="([^"]+)"/)||[])[1];if(id&&tg)map[id]='word/'+tg.replace(/^\/?word\//,'').replace(/^\.\//,'');return t});
    xml.replace(/r:embed="([^"]+)"/g,(m,id)=>{if(map[id]&&!order.includes(map[id]))order.push(map[id]);return m})}}catch(e){}
  const media=z.entries.filter(e=>/^word\/media\/.+\.(png|jpe?g|gif|bmp|webp)$/i.test(e.name));
  media.sort((a,b)=>{const ia=order.indexOf(a.name),ib=order.indexOf(b.name);return(ia<0?1e9:ia)-(ib<0?1e9:ib)});
  const images=[];for(const e of media){if(e.csize<1500)continue;const ext=e.name.split('.').pop().toLowerCase();
    images.push(new Blob([await z.read(e)],{type:'image/'+(ext==='jpg'?'jpeg':ext)}))}
  const skipped=z.entries.filter(e=>/^word\/media\/.+\.(emf|wmf|tiff?)$/i.test(e.name)).length;
  return{text:docxXmlText(xml),images,skipped};
}
function docxXmlText(xml){
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',doc=new DOMParser().parseFromString(xml,'application/xml');
  const body=doc.getElementsByTagNameNS(W,'body')[0];if(!body)return'';
  const para=el=>[...el.getElementsByTagNameNS(W,'t')].map(t=>t.textContent).join('');const out=[];
  for(const el of body.children){if(el.localName==='p')out.push(para(el));
    else if(el.localName==='tbl')for(const tr of el.getElementsByTagNameNS(W,'tr'))out.push([...tr.getElementsByTagNameNS(W,'tc')].map(tc=>[...tc.getElementsByTagNameNS(W,'p')].map(para).join(' ').trim()).join(' | '))}
  return out.map(l=>l.trim()).filter(l=>l&&l.replace(/[|\s]/g,'')).join('\n');
}
function chunkLines(text,max){const out=[];let cur='';for(const l of text.split('\n')){if(cur.length+l.length+1>max&&cur){out.push(cur);cur=''}cur+=(cur?'\n':'')+l}if(cur)out.push(cur);return out}

function decide(d){

}

/* ---------- /mails ---------- */
const typeOf=a=>a.status==='zusage'?(a.nachruecker?'nach':'zusage'):a.status;
function fill(s,a){const p=byStatus('warte').findIndex(x=>x.id===a.id)+1;return String(s).replace(/\{vorname\}/g,a.vn||'').replace(/\{kurs\}/g,S.kurs).replace(/\{termin\}/g,S.termin).replace(/\{termin2\}/g,S.termin2).replace(/\{ort\}/g,S.ort).replace(/\{absender\}/g,S.absender).replace(/\{position\}/g,p||'–')}
const jobOf=id=>JOBS.find(j=>j.app_id===id);
const mailState=a=>{if(a.mail==='versendet')return'versendet';if(a.mail==='entwurf')return'entwurf in Mail';const j=jobOf(a.id);if(j)return j.status==='fehler'?'<span class="bad">fehler</span>':'wartet auf Mail-Helfer';return'—'};
async function makeDrafts(list){
  if(busy||!list.length)return;busy=true;
  try{const jobs=list.map(a=>{const t=S.tpl[typeOf(a)];return{app_id:a.id,to:a.email,subject:fill(t.s,a),body:fill(t.b,a),sender:S.senderAddr||''}});
    await api('/api/drafts',{method:'POST',body:JSON.stringify({jobs})});
    list.forEach(a=>{JOBS=JOBS.filter(j=>j.app_id!==a.id);JOBS.push({app_id:a.id,status:'offen'})});
    toast(helperOnline()?`${list.length} Entwürfe beauftragt. Der Mail-Helfer legt sie gleich in Apple Mail an.`:`${list.length} Entwürfe beauftragt. Sie entstehen, sobald der Mail-Helfer auf dem Mac läuft.`,5000)}
  catch(e){if(e.status!==401)toast(e.message,6000)}finally{busy=false;rMails()}
}
function rMails(){
  const z=byStatus('zusage').filter(a=>!a.nachruecker),nr=byStatus('zusage').filter(a=>a.nachruecker),w=byStatus('warte'),ab=byStatus('absage').filter(a=>!a.ersetzt),off=byStatus('offen');
  const all=[...nr,...z,...w,...ab];if(!all.some(a=>a.id===mailSel))mailSel=(all.find(a=>!a.mail)||all[0]||{}).id;
  const noAddr=all.filter(a=>!a.email).length;
  const grp=(t,l,k)=>{if(!l.length)return'';const open=l.filter(a=>!a.mail&&a.email&&!(jobOf(a.id)&&jobOf(a.id).status==='offen'));return `<div class="group"><div class="gh"><span>${t} <span class="m">${l.length}</span></span><span class="acts">${open.length?`<button class="link u" data-dr="${k}">${open.length} Entwürfe anlegen</button>`:''}<button class="link m" data-all="${k}">alle versendet</button></span></div>
    ${l.map((a,i)=>`<div class="rc ${a.id===mailSel?'on':''}" data-id="${a.id}"><span>${k==='warte'?`<span class="m">${i+1}&nbsp;&nbsp;</span>`:''}${fullName(a)}</span><span class="${a.email?'m':'bad'}">${a.email?mailState(a):'keine Adresse'}</span></div>`).join('')}</div>`};
  const a=S.apps.find(x=>x.id===mailSel);let prev='<p class="m">Noch niemand entschieden.</p>';
  if(a){const t=S.tpl[typeOf(a)];prev=`<div class="hdr"><span>an</span><span>${esc(a.email)||'<span class="bad">keine Adresse</span>'}</span><span>betreff</span><span id="pSub">${esc(fill(t.s,a))}</span></div><pre id="pBody">${esc(fill(t.b,a))}</pre>
    <p style="margin:-6px 0 14px"><button class="link u m" data-open="${a.id}">Detailansicht öffnen</button></p><div class="actions">${a.email?`<button class="btn ${a.mail?'':'solid'}" id="draft">${a.mail==='entwurf'?'Nochmal als Entwurf':'Entwurf in Apple Mail'}</button>`:''}<button class="btn" id="cpy">Text kopieren</button><button class="btn" id="sent">${a.mail==='versendet'?'Zurück auf offen':'Als versendet markieren'}</button></div>`}
  $('#main').innerHTML=`${off.length?`<p class="notice">${off.length} noch nicht entschieden, bekommen keine Mail.</p>`:''}${noAddr?`<p class="notice bad">${noAddr} ohne E-Mail-Adresse. Im Import nachtragen.</p>`:''}${helperOnline()?'<p class="m">Mail-Helfer verbunden.</p>':'<p class="notice">Mail-Helfer nicht verbunden. Beauftragte Entwürfe entstehen, sobald er auf dem Mac läuft.</p>'}${JOBS.some(j=>j.status==='fehler')?`<p class="notice bad">${JOBS.filter(j=>j.status==='fehler').length} Entwürfe fehlgeschlagen: ${esc((JOBS.find(j=>j.status==='fehler')||{}).error||'')}. Erneut beauftragen über die Vorschau.</p>`:''}
  <div class="mailgrid"><div>${grp('nachrücker',nr,'nach')}${grp('zusage',z,'zusage')}${grp('warteliste',w,'warte')}${grp('absage',ab,'absage')}
  <p class="f">Texte und Absender unter /einstellungen.</p></div><div><div class="preview">${prev}</div></div></div>`;
  const groupOf=k=>k==='nach'?nr:k==='zusage'?z:k==='warte'?w:ab;
  $$('.rc').forEach(r=>r.onclick=()=>{mailSel=r.dataset.id;rMails()});
  $$('[data-all]').forEach(b=>b.onclick=()=>{groupOf(b.dataset.all).forEach(x=>x.mail='versendet');save();rMails()});
  $$('[data-dr]').forEach(b=>b.onclick=()=>makeDrafts(groupOf(b.dataset.dr).filter(x=>!x.mail&&x.email&&!(jobOf(x.id)&&jobOf(x.id).status==='offen'))));
  if(a){
    if($('#draft'))$('#draft').onclick=()=>makeDrafts([a]);
    $('#cpy').onclick=()=>{const txt=$('#pSub').textContent+'\n\n'+$('#pBody').textContent;navigator.clipboard.writeText(txt).then(()=>toast('Kopiert'),()=>toast('Kopieren nicht möglich'))};
    $('#sent').onclick=()=>{a.mail=a.mail==='versendet'?null:'versendet';save();if(a.mail){const nx=[...nr,...z,...w,...ab].find(x=>!x.mail);if(nx)mailSel=nx.id}rMails()}}
}

/* ---------- /erste-sitzung ---------- */
function rSitzung(){
  const z=byStatus('zusage').filter(a=>!a.nachruecker),w=byStatus('warte'),miss=z.filter(a=>a.anwesend===false),nr=byStatus('zusage').filter(a=>a.nachruecker);
  const da=z.filter(a=>a.anwesend===true).length;
  $('#main').innerHTML=`<div class="col1"><p class="m">${esc(S.termin)} · ${da} da · ${miss.length} nicht da · ${z.length-da-miss.length} offen</p>
  ${miss.length?`<p class="notice">${miss.length} ${miss.length>1?'Plätze':'Platz'} frei. ${w.length?`Nächste auf der Warteliste: ${w.slice(0,miss.length).map(fullName).join(', ')}. <button class="btn solid" id="nach" style="margin-left:6px">Nachrücken lassen</button>`:'Warteliste ist leer.'}</p>`:''}
  <div class="list" style="margin-top:18px">${z.map(a=>`<div class="att"><span><button class="link" data-open="${a.id}">${photoTag(a.id,'th lg')}${fullName(a)}</button></span><span class="seg" data-id="${a.id}"><button class="${a.anwesend===true?'on':''}" data-v="1">da</button><button class="n ${a.anwesend===false?'on':''}" data-v="0">nicht da</button></span></div>`).join('')||'<p class="m" style="padding-top:10px">Noch keine Zusagen.</p>'}</div>
  ${nr.length?`<p class="m" style="margin-top:26px">Nachgerückt: ${nr.map(fullName).join(', ')}. Mails unter /mails.</p>`:''}</div>`;
  $$('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{const p=S.apps.find(x=>x.id===sg.dataset.id),v=b.dataset.v==='1';p.anwesend=p.anwesend===v?null:v;save();rSitzung()}));
  if($('#nach'))$('#nach').onclick=()=>{let n=0;miss.forEach(m=>{const nx=byStatus('warte')[0];if(!nx)return;m.status='absage';m.ersetzt=true;m.order=999;nx.status='zusage';nx.nachruecker=true;nx.mail=null;nx.order=byStatus('zusage').length;n++});
    byStatus('warte').forEach((x,i)=>x.order=i);save();header();rSitzung();toast(n+' nachgerückt')};
}

/* ---------- /auswertung ---------- */
function rAuswertung(){
  const all=S.apps,z=byStatus('zusage'),w=byStatus('warte').length,ab=byStatus('absage').length,of=byStatus('offen').length;
  const BA=a=>a.abschluss==='Bachelor',MA=a=>a.abschluss==='Master';
  const lenB=F().letters?(a=>{const w=(a.mot||'').trim().split(/\s+/).filter(Boolean).length;return !w?'kein Schreiben':w<250?'unter 250 Wörter':w<400?'250–399 Wörter':'400 Wörter und mehr'}):(a=>{const n=(a.mot||'').length;return n<100?'unter 100 Zeichen':n<150?'100–149 Zeichen':n<200?'150–199 Zeichen':'200 Zeichen und mehr'});
  const bars=(f,list,order,sortNum)=>{const c=new Map(),cz=new Map();list.forEach(a=>{const k=f(a);c.set(k,(c.get(k)||0)+1);if(a.status==='zusage')cz.set(k,(cz.get(k)||0)+1)});
    let keys=[...c.keys()];keys=order?order.filter(k=>c.has(k)).concat(keys.filter(k=>!order.includes(k))):sortNum?keys.sort((x,y)=>(x==='?')-(y==='?')||x-y):keys.sort((x,y)=>c.get(y)-c.get(x));
    if(!keys.length)return '<p class="m">Keine Bewerbungen.</p>';const max=Math.max(...keys.map(k=>c.get(k)));
    return keys.map(k=>`<div class="row"><span class="lbl" title="${esc(k)}">${esc(sortNum&&k!=='?'?k+'. Semester':k)}</span><span class="track"><span class="all" style="width:${c.get(k)/max*100}%"></span><span class="sel" style="width:${(cz.get(k)||0)/max*100}%"></span></span><span class="n"><b>${cz.get(k)||0}</b> / ${c.get(k)}</span></div>`).join('')};
  const pair=(f,sortNum)=>`<div class="pair"><div><h3>Bachelor <span class="f">${all.filter(BA).length}</span></h3>${bars(f,all.filter(BA),null,sortNum)}</div><div><h3>Master <span class="f">${all.filter(MA).length}</span></h3>${bars(f,all.filter(MA),null,sortNum)}</div></div>`;
  const lens=all.map(a=>(a.mot||'').length).sort((x,y)=>x-y),med=lens.length?lens[Math.floor(lens.length/2)]:0;
  $('#main').innerHTML=`
  <div class="kpi"><span><b>${all.length}</b>Bewerbungen</span><span><b>${P()?(all.length/P()).toFixed(1).replace('.',','):'–'}</b>pro Platz</span><span><b class="${z.length>P()?'bad':''}">${z.length}</b>Zusagen</span><span><b>${w}</b>Warteliste</span><span><b>${ab}</b>Absagen</span><span><b>${of}</b>offen</span></div>
  <div class="leg"><span><i style="background:var(--s1)"></i>Zusagen</span><span><i style="background:var(--rule)"></i>alle Bewerbungen</span></div>
  <section class="aw"><h2>Bachelor / Master</h2>${bars(a=>a.abschluss||'unklar',all,['Bachelor','Master','unklar'])}</section>
  <section class="aw"><h2>Studiengang</h2>${pair(a=>a.sg||'unklar')}</section>
  <section class="aw"><h2>Semester</h2>${pair(a=>a.sem==null?'?':String(a.sem),true)}</section>
  <section class="aw"><h2>Länge ${F().letters?'des Motivationsschreibens':'der Motivation'} <span class="f">Median ${F().letters?Math.round(med/6.5)+' Wörter':med+' Zeichen'}</span></h2>${bars(lenB,all,F().letters?['kein Schreiben','unter 250 Wörter','250–399 Wörter','400 Wörter und mehr']:['unter 100 Zeichen','100–149 Zeichen','150–199 Zeichen','200 Zeichen und mehr'])}</section>
  ${F().letters?`<section class="aw"><h2>Empfehlungsschreiben</h2>${bars(a=>{const n=recCount(a);return n===0?'keines':n===1?'eines':'zwei oder mehr'},all,['keines','eines','zwei oder mehr'])}</section>`:''}
  ${F().info&&Array.isArray(S.infoNames)?`<section class="aw"><h2>Infoveranstaltung</h2>${bars(a=>a.info===true?'teilgenommen':'nicht teilgenommen',all,['teilgenommen','nicht teilgenommen'])}</section>`:''}
  <section class="aw"><h2>Männlich / weiblich</h2>${bars(a=>({w:'weiblich',m:'männlich'})[a.g]||'unklar',all,['weiblich','männlich','unklar'])}</section>`;
}

/* ---------- /einstellungen ---------- */
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csv(rows){return '﻿'+rows.map(r=>r.map(v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\n')}
function rSettings(){
  const f=(id,k,l,type='text')=>`<div><label for="${id}">${l}</label><input id="${id}" type="${type}" value="${esc(S[k])}" data-k="${k}"></div>`;
  $('#main').innerHTML=`<div class="col1">
  <section class="sec"><h2>Kurs</h2><div class="settings">${f('sK','kurs','Name')}${f('sS','semester','Semester')}${f('sP','plaetze','Plätze','number')}${f('sO','ort','Ort')}${f('sT','termin','Erste Sitzung')}${f('sT2','termin2','Nächste Sitzung (für Nachrücker)')}</div></section>
  <section class="sec"><h2>Absender</h2><div class="settings">${f('sA','absender','Name unter den Mails')}${f('sM','senderAddr','Absender-Adresse in Apple Mail','email')}</div>
   <p class="f" style="margin-top:10px">Muss genau einer Adresse entsprechen, die in Apple Mail eingerichtet ist. Leer lassen für das Standardkonto.</p></section>
  <section class="sec"><h2>Mailtexte</h2><p class="f">Platzhalter: {vorname} {kurs} {termin} {termin2} {ort} {position} {absender}</p>
   ${[['zusage','Zusage'],['warte','Warteliste'],['absage','Absage'],['nach','Nachrücken']].map(([k,t])=>`<label for="ts_${k}" style="margin-top:16px">${t}</label><input id="ts_${k}" value="${esc(S.tpl[k].s)}"><textarea id="tb_${k}">${esc(S.tpl[k].b)}</textarea>`).join('')}
   <button class="link u m" id="tplReset">Standardtexte wiederherstellen</button></section>
  <section class="sec"><h2>Studiengänge</h2><p class="f">Doppelte Schreibweisen zusammenführen. Die Regel gilt auch für alle späteren Importe.</p>
   ${(()=>{const c={};S.apps.forEach(a=>{if(a.sg)c[a.sg]=(c[a.sg]||0)+1});const names=Object.keys(c).sort((x,y)=>x.localeCompare(y,'de'));
     return names.length?`<div class="list">${names.map(n=>`<div class="att"><span>${esc(n)} <span class="m">${c[n]}</span></span><select class="mrg" data-from="${esc(n)}" style="width:auto;color:var(--muted)"><option value="">zusammenführen mit …</option>${names.filter(x=>x!==n).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>`).join('')}</div>`:'<p class="m">Noch keine Bewerbungen.</p>'})()}
   ${Object.keys(S.sgAlias).length?`<p class="m" style="margin-top:14px">Eigene Regeln: ${Object.entries(S.sgAlias).map(([k,v])=>`${esc(k)} → ${esc(v)} <button class="link u" data-unalias="${esc(k)}">entfernen</button>`).join(' · ')}</p>`:''}</section>
  <section class="sec"><h2>Teamlink</h2><p class="m">Wer diesen Link hat, hat vollen Zugriff auf alle Bewerbungen. Nur intern weitergeben.</p>
   <div style="display:flex;gap:10px;align-items:end"><div style="flex:1;min-width:0"><input id="tLink" readonly value="${esc(location.origin+'/#k='+TOKEN)}"></div><button class="btn" id="tCopy">Kopieren</button></div>
   <p style="margin-top:14px"><button class="link u" id="tNew">Neuen Teamlink erzeugen</button> <span class="f">Der alte Link funktioniert danach sofort nicht mehr, auch im Mail-Helfer.</span></p></section>
  <section class="sec"><h2>System</h2><p class="m">Version ${esc(HEALTH.version||'?')} · Mistral: ${HEALTH.mistral?'aktiv':'<span class="bad">kein Key bei Vercel hinterlegt</span>'} · Mail-Helfer: ${helperOnline()?'verbunden':'nicht verbunden'}</p></section>
  <section class="sec"><h2>Daten</h2>
   <p class="m">Bewerbungen und Fotos liegen in einer Datenbank in Frankfurt (Supabase). Zugriff nur mit dem Teamlink.</p>
   <div class="actions" style="margin-bottom:22px"><button class="btn" id="csv">Liste als CSV</button><button class="btn" id="json">Sicherung als JSON</button><button class="btn" id="restore">Sicherung einspielen</button><input type="file" id="restoreF" accept="application/json,.json" hidden><button class="btn" id="newRound">Neue Runde beginnen</button></div>
   <p class="m">Nach Abschluss des Kurses sollten die Bewerberdaten gelöscht werden. Das entfernt alle Bewerbungen dieses Kurses (${esc(S.kurs)}) mit Fotos, Dokumenten und Mail-Aufträgen für das ganze Team. Der andere Kurs bleibt unberührt.</p>
   <div style="display:flex;gap:10px;align-items:end;max-width:420px"><div style="flex:1"><label for="wipeC">Zum Löschen LÖSCHEN eintippen</label><input id="wipeC" autocomplete="off"></div><button class="btn" id="wipe" style="border-color:var(--bad);color:var(--bad)">Alle Daten löschen</button></div>
  </section></div>`;
  $$('#main input[data-k]').forEach(i=>i.onchange=()=>{S[i.dataset.k]=i.type==='number'?Math.max(1,parseInt(i.value)||1):i.value.trim();save();header()});
  ['zusage','warte','absage','nach'].forEach(k=>{$('#ts_'+k).onchange=e=>{S.tpl[k].s=e.target.value;save()};$('#tb_'+k).onchange=e=>{S.tpl[k].b=e.target.value;save()}});
  $$('.mrg').forEach(m=>m.onchange=()=>{const from=m.dataset.from,to=m.value;if(!to)return;S.sgAlias[from.toLowerCase()]=to;
    Object.keys(S.sgAlias).forEach(k=>{if(S.sgAlias[k]===from)S.sgAlias[k]=to});S.apps.forEach(a=>{if(a.sg===from)a.sg=to});save();rSettings();toast(`${from} → ${to}`)});
  $$('[data-unalias]').forEach(b=>b.onclick=()=>{delete S.sgAlias[b.dataset.unalias];save();rSettings()});
  $('#tplReset').onclick=()=>{S.tpl=JSON.parse(JSON.stringify(DEFAULT_TPL));save();rSettings();toast('Standardtexte wiederhergestellt')};
  const stamp=new Date().toISOString().slice(0,10);
  $('#csv').onclick=()=>download(`${S.kurs}-${stamp}.csv`,csv([['Status','Wartelistenplatz','Vorname','Nachname','E-Mail','Studiengang','Abschluss','Semester','Geschlecht (geschätzt)','Infoveranstaltung','Empfehlungen','Eingang','Mail','Erste Sitzung','Nachrücker','Motivation'],
    ...['zusage','warte','absage','offen'].flatMap(st=>byStatus(st).map((a,i)=>[SN[st],st==='warte'?i+1:'',a.vn,a.nn,a.email,a.sg,a.abschluss,a.sem??'',a.g,a.info===true?'ja':a.info===false?'nein':'',filesOf(a.id).filter(f=>f.kind==='empfehlung').map(f=>authorOf(f)||f.name).join(' | '),a.date,a.mail||'',a.anwesend===true?'da':a.anwesend===false?'nicht da':'',a.nachruecker?'ja':'',a.mot]))]),'text/csv;charset=utf-8');
  $('#json').onclick=()=>download(`${S.kurs}-sicherung-${stamp}.json`,JSON.stringify(S,null,1),'application/json');
  $('#tCopy').onclick=()=>{const v=$('#tLink').value;navigator.clipboard.writeText(v).then(()=>toast('Teamlink kopiert'),()=>{$('#tLink').select();toast('Markiert, mit ⌘C kopieren')})};
  $('#tNew').onclick=async()=>{const b=$('#tNew');if(!b.dataset.c){b.dataset.c=1;b.textContent='Wirklich? Alle müssen den neuen Link bekommen. Nochmal klicken';return}
    try{const j=await api('/api/rotate',{method:'POST',body:'{}'});TOKEN=j.token;try{localStorage.setItem('kursauswahl-token',TOKEN)}catch(e){}rSettings();toast('Neuer Teamlink erzeugt. Jetzt ans Team schicken und im Mail-Helfer eintragen.',6000)}catch(e){if(e.status!==401)toast(e.message)}};
  $('#restore').onclick=()=>$('#restoreF').click();
  $('#restoreF').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());const apps=Array.isArray(d.apps)?d.apps:Array.isArray(d)?d:null;if(!apps)throw new Error('Keine Bewerbungen in der Datei');
    const have=new Set(S.apps.map(a=>a.id)),mails=new Set(S.apps.map(a=>a.email).filter(Boolean));let n=0;
    apps.forEach(a=>{if(!a||!a.id||have.has(a.id)||(a.email&&mails.has(a.email)))return;S.apps.push(normApp({...a,course:COURSE},String(a.id).replace(/[^\w-]/g,'').slice(0,64)||('r'+Date.now()+n)));n++});
    if(d.sgAlias)S.sgAlias={...d.sgAlias,...S.sgAlias};save();rSettings();toast(`${n} Bewerbungen eingespielt`)}catch(err){toast('Sicherung nicht lesbar: '+err.message,6000)}};
  const wipeAll=async()=>{clearTimeout(saveTimer);dirty=false;await api('/api/wipe',{method:'POST',body:JSON.stringify({confirm:'LÖSCHEN',course:COURSE})});try{localStorage.setItem('kursauswahl-ui',JSON.stringify({tab:'import',sub:'durchgang',course:COURSE}))}catch(e){}location.reload()};
  $('#newRound').onclick=async()=>{const b=$('#newRound');if(!b.dataset.c){b.dataset.c=1;b.textContent='Alle Bewerbungen für alle entfernen? Nochmal klicken';return}
    download(`${S.kurs}-sicherung-${stamp}.json`,JSON.stringify(S,null,1),'application/json');try{await wipeAll()}catch(e){if(e.status!==401)toast(e.message)}};
  $('#wipe').onclick=async()=>{if($('#wipeC').value!=='LÖSCHEN'){toast('Bitte LÖSCHEN eintippen');return}try{await wipeAll()}catch(e){if(e.status!==401)toast(e.message)}};
}
